<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
<defs>
  <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C0461F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F8A66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .bg{fill:#FBFAF6}
  .card{fill:#FFFFFF;stroke:#DCDAD1;stroke-width:1}
  .t{fill:#2C2C2A;font-size:15px;font-weight:600}
  .ts{fill:#5F5E5A;font-size:12px}
  .dot{fill:#2C2C2A}
  .axL{stroke:#C0461F;stroke-width:1.4;fill:none}
  .scan{stroke:#993C1D;stroke-width:1.2;fill:none;opacity:.75}
  .ret{stroke:#993C1D;stroke-width:1;fill:none;stroke-dasharray:4 4;opacity:.45}
  .axR{stroke:#0F8A66;stroke-width:1.4;fill:none}
  .lead{stroke:#9C9A92;stroke-width:1;stroke-dasharray:4 4;fill:none}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1B1B19}
    .card{fill:#262624;stroke:#3A3A36}
    .t{fill:#ECEAE1}
    .ts{fill:#A29F95}
    .dot{fill:#ECEAE1}
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="380" rx="12"/>

<text class="t" x="185" y="34" text-anchor="middle">Raster / Bildschirm</text>
<text class="ts" x="185" y="52" text-anchor="middle">Ursprung oben links · y wächst nach unten</text>
<rect class="card" x="40" y="70" width="290" height="270" rx="8"/>
<circle class="dot" cx="78" cy="108" r="3"/>
<text class="ts" x="88" y="102">(0,0)</text>
<line class="axL" x1="78" y1="108" x2="300" y2="108" marker-end="url(#aC)"/>
<text class="ts" x="307" y="112">x</text>
<line class="axL" x1="78" y1="108" x2="78" y2="324" marker-end="url(#aC)"/>
<text class="ts" x="70" y="332" text-anchor="end">y</text>
<line class="scan" x1="98" y1="150" x2="286" y2="150" marker-end="url(#aS)"/>
<line class="ret" x1="286" y1="150" x2="98" y2="182"/>
<line class="scan" x1="98" y1="182" x2="286" y2="182" marker-end="url(#aS)"/>
<line class="ret" x1="286" y1="182" x2="98" y2="214"/>
<line class="scan" x1="98" y1="214" x2="286" y2="214" marker-end="url(#aS)"/>
<line class="ret" x1="286" y1="214" x2="98" y2="246"/>
<line class="scan" x1="98" y1="246" x2="286" y2="246" marker-end="url(#aS)"/>
<text class="ts" x="185" y="300" text-anchor="middle">Strahl tastet zeilenweise ab</text>

<text class="t" x="495" y="34" text-anchor="middle">Kartesisch</text>
<text class="ts" x="495" y="52" text-anchor="middle">Ursprung unten links · y wächst nach oben</text>
<rect class="card" x="350" y="70" width="290" height="270" rx="8"/>
<circle class="dot" cx="388" cy="300" r="3"/>
<text class="ts" x="396" y="316">(0,0)</text>
<line class="axR" x1="388" y1="300" x2="612" y2="300" marker-end="url(#aT)"/>
<text class="ts" x="618" y="304">x</text>
<line class="axR" x1="388" y1="300" x2="388" y2="106" marker-end="url(#aT)"/>
<text class="ts" x="388" y="98" text-anchor="middle">y</text>
<line class="lead" x1="388" y1="200" x2="505" y2="200"/>
<line class="lead" x1="505" y1="300" x2="505" y2="200"/>
<circle cx="505" cy="200" r="3" fill="#0F8A66"/>
<text class="ts" x="514" y="196">(x, y)</text>
<text class="ts" x="495" y="332" text-anchor="middle">Konvention aus Mathematik &amp; Druck</text>
</svg>
