<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
<defs>
  <marker id="bS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C0461F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="bF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .bg{fill:#FBFAF6}
  .scr{fill:#F1EFE8;stroke:#C9C7BD;stroke-width:1.2}
  .t{fill:#2C2C2A;font-size:15px;font-weight:600}
  .ts{fill:#5F5E5A;font-size:12px}
  .dot{fill:#C0461F}
  .scan{stroke:#C0461F;stroke-width:1.4;fill:none}
  .ret{stroke:#C0461F;stroke-width:1;fill:none;stroke-dasharray:4 3;opacity:.55}
  .fly{stroke:#5F5E5A;stroke-width:1.2;fill:none;stroke-dasharray:6 4}
  .lead{stroke:#9C9A92;stroke-width:1;stroke-dasharray:4 4;fill:none}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1B1B19}
    .scr{fill:#2B2B28;stroke:#444440}
    .t{fill:#ECEAE1}
    .ts{fill:#A29F95}
    .fly{stroke:#A29F95}
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="420" rx="12"/>
<text class="t" x="340" y="34" text-anchor="middle">CRT-Rasterabtastung (raster scan)</text>
<text class="ts" x="340" y="52" text-anchor="middle">Elektronenstrahl: oben links nach unten rechts, Zeile für Zeile</text>

<path class="fly" d="M535 332 H580 V92 H156 V120" marker-end="url(#bF)"/>
<text class="ts" x="368" y="84" text-anchor="middle">Bildrücklauf (vertical retrace) — zurück nach oben links</text>

<rect class="scr" x="130" y="100" width="420" height="252" rx="10"/>

<line class="scan" x1="152" y1="128" x2="528" y2="128" marker-end="url(#bS)"/>
<line class="ret"  x1="528" y1="128" x2="152" y2="168"/>
<line class="scan" x1="152" y1="168" x2="528" y2="168" marker-end="url(#bS)"/>
<line class="ret"  x1="528" y1="168" x2="152" y2="208"/>
<line class="scan" x1="152" y1="208" x2="528" y2="208" marker-end="url(#bS)"/>
<line class="ret"  x1="528" y1="208" x2="152" y2="248"/>
<line class="scan" x1="152" y1="248" x2="528" y2="248" marker-end="url(#bS)"/>
<line class="ret"  x1="528" y1="248" x2="152" y2="288"/>
<line class="scan" x1="152" y1="288" x2="528" y2="288" marker-end="url(#bS)"/>
<line class="ret"  x1="528" y1="288" x2="152" y2="328"/>
<line class="scan" x1="152" y1="328" x2="528" y2="328" marker-end="url(#bS)"/>

<circle class="dot" cx="152" cy="128" r="3.5"/>
<line class="lead" x1="124" y1="128" x2="152" y2="128"/>
<text class="ts" x="20" y="124">Start: (0,0)</text>
<text class="ts" x="20" y="140">Speicheradresse 0</text>

<line class="lead" x1="528" y1="168" x2="560" y2="168"/>
<text class="ts" x="564" y="164">Zeilenrücklauf</text>
<text class="ts" x="564" y="180">(horizontal retrace)</text>

<text class="ts" x="340" y="380" text-anchor="middle">Diese Abtastreihenfolge legte die lineare Speicheradressierung des Framebuffers fest.</text>
</svg>
