<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#FBFAF6}
  .card{fill:#FFFFFF;stroke:#DCDAD1;stroke-width:1}
  .t{fill:#2C2C2A;font-size:15px;font-weight:600}
  .ts{fill:#5F5E5A;font-size:12px}
  .ok{fill:#1D9E75}
  .bad{fill:#D85A30}
  .dot{fill:#2C2C2A}
  .row{stroke:#C9C7BD;stroke-width:1;stroke-dasharray:3 3;opacity:.7}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1B1B19}
    .card{fill:#262624;stroke:#3A3A36}
    .t{fill:#ECEAE1}
    .ts{fill:#A29F95}
    .dot{fill:#ECEAE1}
    .row{stroke:#444440}
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="370" rx="12"/>

<text class="t" x="170" y="34" text-anchor="middle">Bilddatei (PNG/JPEG)</text>
<text class="ts" x="170" y="52" text-anchor="middle">Zeile 0 oben · (0,0) oben links</text>
<rect class="card" x="40" y="72" width="260" height="232" rx="8"/>
<circle class="dot" cx="60" cy="92" r="3"/>
<text class="ts" x="68" y="88">(0,0)</text>
<line class="row" x1="50" y1="130" x2="290" y2="130"/>
<line class="row" x1="50" y1="236" x2="290" y2="236"/>
<text class="ts" x="296" y="112" text-anchor="end">Zeile 0</text>
<text class="ts" x="296" y="288" text-anchor="end">Zeile n</text>
<polygon class="ok" points="170,108 146,150 158,150 158,272 182,272 182,150 194,150"/>

<text class="t" x="510" y="34" text-anchor="middle">OpenGL-Textur</text>
<text class="ts" x="510" y="52" text-anchor="middle">Zeile 0 unten · (0,0) unten links</text>
<rect class="card" x="380" y="72" width="260" height="232" rx="8"/>
<circle class="dot" cx="400" cy="284" r="3"/>
<text class="ts" x="408" y="300">(0,0)</text>
<line class="row" x1="390" y1="130" x2="630" y2="130"/>
<line class="row" x1="390" y1="236" x2="630" y2="236"/>
<text class="ts" x="636" y="112" text-anchor="end">Zeile n</text>
<text class="ts" x="636" y="288" text-anchor="end">Zeile 0</text>
<polygon class="bad" points="510,268 534,226 522,226 522,104 498,104 498,226 486,226"/>

<text class="ts" x="340" y="338" text-anchor="middle">Gleiche Bytes, gespiegelte Achse — das Bild steht Kopf.  Fix: v-Koordinate spiegeln (v → 1 − v).</text>
</svg>
