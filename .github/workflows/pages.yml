name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # volle Historie für Änderungsdaten
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.117.0"
      - name: npm-Cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('scripts/website.nu') }}
      - name: Vault prüfen
        run: nu scripts/pruefen.nu --nur-fehler
      - name: Website bauen
        run: nu scripts/website.nu
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
